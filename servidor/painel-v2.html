<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #101113; --ink: #F3EEE6; --mute: #A7A7AB; --faint: #6F7075;
    --laranja: #FF7119;
    --line: rgba(243, 238, 230, 0.09); --line2: rgba(243, 238, 230, 0.18);
    --gold: #E8C88E; --gold2: #F6DFB2; --glow: rgba(232, 200, 142, 0.20);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --f: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--base); color: var(--ink); font-family: var(--f); -webkit-font-smoothing: antialiased; }
  body { position: relative; overflow-x: hidden; min-height: 660px; }
  body.cheia { min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }

  #relevo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; transition: opacity 1s var(--ease), transform 1.4s var(--ease); }
  body[data-tela="guia"] #relevo, body[data-tela="fim"] #relevo, body[data-tela="acompanhar"] #relevo { opacity: .4; transform: translateY(70px); }
  .luz { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(900px 520px at 72% -12%, rgba(232, 200, 142, 0.13), transparent 62%),
      radial-gradient(760px 520px at -6% 112%, rgba(128, 130, 138, 0.16), transparent 60%),
      radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55)); }
  .grao { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .palco { position: relative; z-index: 3; min-height: inherit; padding: 22px 26px 26px; display: flex; flex-direction: column; }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .marca { font-weight: 700; font-size: 19px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 4px; }
  .esq { display: flex; align-items: center; gap: 14px; }
  .marca i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px var(--gold); margin-top: 6px; }
  .trilho { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); display: flex; gap: 10px; align-items: center; }
  .trilho button { color: var(--mute); transition: color .2s; } .trilho button:hover { color: var(--ink); }
  .trilho span { color: var(--faint); }
  .fantasma { font-size: 12.5px; color: var(--mute); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); transition: border-color .2s, color .2s; }
  .fantasma:hover { color: var(--ink); border-color: var(--line2); }

  #tela { flex: 1; display: flex; flex-direction: column; margin-top: 26px; }
  .entra { animation: entra .55s var(--ease) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

  .ola { font-size: 13px; color: var(--mute); letter-spacing: .02em; }
  .titulo { font-size: clamp(30px, 4.4vw, 48px); font-weight: 500; letter-spacing: -0.045em; line-height: 1.02; margin-top: 8px; max-width: 640px; }
  .titulo em { font-style: normal; color: var(--gold2); }

  .portas { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; margin-top: auto; padding-top: 28px; }
  .porta { position: relative; overflow: hidden; border-radius: 22px; padding: 20px 20px 22px; min-height: 250px; display: flex; flex-direction: column;
    background: linear-gradient(165deg, rgba(44, 45, 49, 0.74), rgba(17, 18, 20, 0.64) 62%);
    border: 1px solid var(--laranja); backdrop-filter: blur(16px) saturate(120%); -webkit-backdrop-filter: blur(16px) saturate(120%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 40px 70px -30px rgba(0, 0, 0, 0.75);
    transition: transform .6s var(--ease), border-color .3s, box-shadow .6s var(--ease); }
  .porta::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(260px 200px at var(--mx, 50%) var(--my, 0%), rgba(246, 223, 178, 0.13), transparent 70%); }
  .porta:hover { transform: translateY(-6px); box-shadow: 0 0 0 1px rgba(255, 113, 25, 0.35), 0 0 34px -6px rgba(255, 113, 25, 0.35), inset 0 1px 0 rgba(255,255,255,.1), 0 50px 80px -30px rgba(0,0,0,.85); }
  .porta:hover::after { opacity: 1; }
  .porta .n { font-size: 11.5px; letter-spacing: .16em; color: var(--faint); }
  .porta svg { position: absolute; right: -18px; top: -14px; width: 180px; height: 180px; }
  .porta h3 { margin-top: auto; font-size: 27px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
  .porta p { color: var(--mute); font-size: 13.5px; line-height: 1.4; margin-top: 8px; max-width: 230px; }
  .porta .ir { margin-top: 16px; font-size: 12.5px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .porta .ir b { display: inline-block; width: 22px; height: 1px; background: var(--gold); transition: width .4s var(--ease); }
  .porta:hover .ir b { width: 40px; }

  .sub { color: var(--mute); font-size: 15px; line-height: 1.5; margin-top: 12px; max-width: 520px; }
  .porta.tarefa { min-height: 200px; }
  .porta.tarefa svg { width: 150px; height: 150px; opacity: .8; }
  .porta.tarefa h3 { font-size: 23px; }
  .porta.larga { grid-column: span 2; }
  .porta.larga p { max-width: 320px; }

  .guia { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; flex: 1; }
  .vidro { position: relative; overflow: hidden; border-radius: 26px; padding: 26px 26px 22px;
    background: linear-gradient(170deg, rgba(44, 45, 49, 0.78), rgba(17, 18, 20, 0.70) 60%);
    border: 1px solid var(--laranja); backdrop-filter: blur(20px) saturate(120%); -webkit-backdrop-filter: blur(20px) saturate(120%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 50px 90px -40px rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; }
  .prog { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .trilha-prog { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .trilha-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); box-shadow: 0 0 12px var(--gold); transition: width .7s var(--ease); }
  .vidro > * { position: relative; z-index: 1; }
  .vidro > .numeral { position: absolute; z-index: 0; right: 26px; bottom: 64px; font-size: 200px; font-weight: 700; letter-spacing: -0.06em; line-height: 1;
    color: transparent; -webkit-text-stroke: 1px rgba(232, 200, 142, 0.16); pointer-events: none; font-variant-numeric: tabular-nums; }
  .meio { margin-block: auto; padding: 18px 0 8px; }
  .q { margin-top: 0; }
  .q h2 { font-size: clamp(26px, 3.3vw, 38px); font-weight: 500; letter-spacing: -0.04em; line-height: 1.04; max-width: 560px; }
  .q .ajuda { color: var(--mute); font-size: 14px; margin-top: 10px; }
  .opcoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
  .op { display: flex; gap: 14px; align-items: flex-start; padding: 15px 16px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
    border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: transform .35s var(--ease), border-color .25s, background .25s, box-shadow .35s; }
  .op:hover { transform: translateY(-2px); border-color: var(--line2); }
  .op .k { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--mute);
    background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.06); transition: all .3s; }
  .op b { display: block; font-weight: 500; font-size: 15.5px; letter-spacing: -0.012em; }
  .op small { display: block; color: var(--mute); font-size: 12.5px; line-height: 1.35; margin-top: 3px; }
  .op.on { border-color: rgba(232, 200, 142, 0.55); background: linear-gradient(180deg, rgba(232, 200, 142, 0.13), rgba(232, 200, 142, 0.03));
    box-shadow: 0 0 0 1px rgba(232, 200, 142, 0.22), 0 18px 40px -16px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.09); }
  .op.on .k { background: var(--gold); color: #1B150A; box-shadow: 0 0 18px rgba(232, 200, 142, 0.55); }
  .rodape { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; padding-top: 22px; }
  .dica { font-size: 12px; color: var(--faint); }
  .seguir { display: inline-flex; align-items: center; gap: 12px; padding: 13px 20px; border-radius: 14px; font-weight: 600; font-size: 14.5px; color: #1B150A; letter-spacing: -0.01em;
    background: linear-gradient(180deg, var(--gold2), #DDB670); box-shadow: 0 14px 34px -12px rgba(232, 200, 142, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.65);
    transition: transform .3s var(--ease), box-shadow .3s, opacity .3s; }
  .seguir:hover { transform: translateY(-1px); box-shadow: 0 20px 40px -12px rgba(232, 200, 142, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .seguir[aria-disabled="true"] { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
  .seguir span { font-size: 16px; }

  .dossie { border-radius: 22px; padding: 20px; background: linear-gradient(180deg, rgba(12, 12, 14, 0.72), rgba(12, 12, 14, 0.5));
    border: 1px solid var(--laranja); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; }
  .dossie h4 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  .dossie .nome { font-size: 19px; font-weight: 600; letter-spacing: -0.03em; margin-top: 6px; }
  .linha-d { padding: 11px 0; border-top: 1px solid var(--line); }
  .linha-d:first-of-type { margin-top: 14px; }
  .linha-d small { display: block; font-size: 11px; color: var(--faint); letter-spacing: .04em; }
  .linha-d div { font-size: 13.5px; margin-top: 3px; color: var(--faint); transition: color .4s; }
  .linha-d.ok div { color: var(--ink); }
  .linha-d.agora small { color: var(--gold); }
  .dossie .pe { margin-top: auto; padding-top: 14px; font-size: 12px; color: var(--faint); line-height: 1.45; }

  .fim h2 { font-size: clamp(30px, 4vw, 44px); font-weight: 500; letter-spacing: -0.045em; line-height: 1.02; }
  .fim .ajuda { color: var(--mute); font-size: 14.5px; margin-top: 12px; max-width: 460px; line-height: 1.5; }
  .md p { margin: 0 0 9px; line-height: 1.55; } .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom: 0; }
  .md h4 { margin: 12px 0 5px; font-size: 1em; font-weight: 700; color: var(--gold2); }
  .md ul, .md ol { margin: 0 0 9px; padding-left: 22px; } .md li { margin-bottom: 3px; line-height: 1.5; }
  .md blockquote { margin: 0 0 9px; padding: 2px 0 2px 12px; border-left: 3px solid rgba(232,200,142,.45); color: var(--mute); }
  .md hr { border: 0; border-top: 1px solid var(--line2); margin: 10px 0; }
  .md pre { margin: 0 0 9px; padding: 9px 11px; background: rgba(255,255,255,.05); border-radius: 9px; overflow-x: auto; font-size: .9em; }
  .md code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  .md table { border-collapse: collapse; margin: 0 0 9px; font-size: .94em; } .md th, .md td { border: 1px solid var(--line2); padding: 5px 9px; text-align: left; } .md th { background: rgba(255,255,255,.05); }
  .md > p:first-child:has(> strong:first-child:last-child) { font-size: 1.1em; line-height: 1.45; padding: 10px 14px; margin-bottom: 12px; background: rgba(232,200,142,.09); border-left: 3px solid var(--gold2); border-radius: 0 10px 10px 0; }
  .md h4 { text-transform: uppercase; letter-spacing: .12em; font-size: .76em; margin: 16px 0 6px; }
  .md strong { color: var(--ink); } .md tr:nth-child(even) td { background: rgba(255,255,255,.03); }
  .md th { color: var(--gold2); font-size: .85em; letter-spacing: .06em; text-transform: uppercase; }
  .md a { color: var(--gold2); }
  .md .tab { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line2); border-radius: 10px; } .md .tab table { width: 100%; margin: 0; border-collapse: collapse; } .md .tab th, .md .tab td { border: 0; border-bottom: 1px solid var(--line2); } .md .tab tr:last-child td { border-bottom: 0; }
  .md td.s-up { color: #8fd19e; } .md td.s-down { color: #f2958a; } .md td.s-mid { color: #e8c88e; } .md td.s-ok { color: #8fd19e; }
  .md details.recolhida { margin: 0 0 9px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; } .md details.recolhida > summary { cursor: pointer; padding: 9px 0; font-weight: 700; color: var(--gold2); letter-spacing: .04em; } .md details.recolhida[open] > summary { border-bottom: 1px solid var(--line2); margin-bottom: 8px; }
  .texto-md { margin-top: 10px; max-height: 38vh; overflow-y: auto; padding: 12px 14px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; font-size: 14.5px; }
  .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; margin: 14px 0 6px; }
  .campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .campo.larga { grid-column: 1 / -1; }
  .campo label { font-size: 12.5px; color: var(--mute); line-height: 1.3; }
  .campo label i { font-style: normal; color: var(--faint); }
  .campo input, .campo textarea { width: 100%; padding: 10px 13px; border-radius: 11px; background: rgba(255,255,255,.04); border: 1px solid var(--line2); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.4; resize: vertical; }
  .campo input:focus, .campo textarea:focus { outline: none; border-color: rgba(232,200,142,.55); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line2); color: var(--mute); transition: all .15s; }
  .chip:hover, .chip.on { color: var(--ink); border-color: rgba(232,200,142,.6); background: rgba(232,200,142,.09); }
  .detalhes-pedido { margin-top: 12px; }
  .detalhes-pedido summary { cursor: pointer; color: var(--mute); font-size: 13px; padding: 6px 0; }
  .apagar-t { position: absolute; top: 12px; right: 14px; font-size: 11.5px; color: var(--faint); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line); z-index: 3; cursor: pointer; }
  .apagar-t:hover { color: #ff9d7a; border-color: rgba(255,157,122,.5); }
  @media (max-width: 720px) { .campos { grid-template-columns: 1fr; } }
  .linha-melhora { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .melhora-campo { flex: 1; min-width: 220px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--line2); color: var(--ink); font: inherit; }
  .prompt { width: 100%; min-height: 300px; max-height: 56vh; resize: vertical; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--line2);
    color: var(--ink); font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none; }
  .prompt:focus { border-color: rgba(232,200,142,.55); }
  .linha-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .mini { font-size: 12.5px; color: var(--ink); padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(255,255,255,.03); transition: border-color .2s, background .2s; }
  .mini:hover { border-color: rgba(232,200,142,.55); background: rgba(232,200,142,.07); }
  .mini.ouro { color: #1B150A; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: transparent; font-weight: 600; }
  .mini[disabled] { opacity: .5; pointer-events: none; }
  .cartao { margin-top: 22px; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(232,200,142,.4); background: rgba(232,200,142,.06); }
  .cartao h3 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--gold2); }
  .cartao p { font-size: 13px; color: var(--mute); margin-top: 4px; line-height: 1.45; }
  .conversa { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .conversa h3 { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 500; margin-bottom: 10px; }
  .conversa .msg { font-size: 13px; color: var(--mute); padding: 7px 0; line-height: 1.45; }
  .conversa .msg b { color: var(--ink); font-weight: 500; }
  .conversa textarea { width: 100%; min-height: 64px; max-height: 24vh; resize: vertical; padding: 11px 14px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--line2); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.5; outline: none; margin-top: 10px; }
  .conversa textarea:focus { border-color: rgba(232,200,142,.55); }
  .estado { font-size: 13px; margin-top: 14px; min-height: 18px; color: var(--mute); }
  .estado.ok { color: var(--ink); } .estado.erro { color: #F0A49A; }

  .acomp .rotulo { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; }
  .acomp .rotulo i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: pulso 1.6s ease-in-out infinite; }
  .acomp.pronto .rotulo i { animation: none; }
  .acomp.suavez .rotulo { color: #9fe3b9; }
  .acomp.suavez .rotulo i { background: #7fd6a0; box-shadow: 0 0 12px #7fd6a0; animation: none; }
  @keyframes pulso { 50% { opacity: .3; } }
  .acomp h2 { font-size: clamp(28px, 3.6vw, 42px); font-weight: 500; letter-spacing: -0.045em; line-height: 1.05; max-width: 600px; }
  .acomp h2.espera { color: var(--mute); }
  .acomp .detalhe { color: var(--mute); font-size: 14.5px; margin-top: 12px; max-width: 520px; line-height: 1.5; }
  .passos { margin-top: 24px; display: grid; gap: 9px; }
  .passo-l { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--faint); }
  .passo-l b { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .passo-l.feito { color: var(--mute); }
  .passo-l.feito b { background: rgba(232, 200, 142, 0.14); border-color: rgba(232, 200, 142, 0.5); color: var(--gold2); }
  .passo-l.agora { color: var(--ink); }
  .passo-l.agora b { background: var(--gold); border-color: var(--gold); color: #1B150A; box-shadow: 0 0 14px rgba(232, 200, 142, 0.5); }

  @media (max-width: 980px) { .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .portas, .guia, .opcoes { grid-template-columns: minmax(0, 1fr); }
    .porta { min-height: 170px; }
    .porta.tarefa { min-height: 150px; }
    .porta.larga { grid-column: auto; }
    .vidro > .numeral { font-size: 140px; bottom: 70px; }
    .palco { padding: 18px 16px 22px; }
    .vidro { padding: 22px 18px 18px; }
    .trilho { gap: 6px; font-size: 10.5px; letter-spacing: .08em; white-space: nowrap; }
    .trilho > :nth-child(n+4) { display: none; }
    .fantasma { white-space: nowrap; }
  }
  @media (hover: none), (max-width: 760px) { .dica { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .entra { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="relevo" aria-hidden="true"></canvas>
<div class="luz"></div>
<div class="grao"></div>

<div class="palco">
  <div class="topo">

  let perfil = null, captamais = null;
  const PDF_OK = ["relatorio-mensal", "carteira", "primeira-reuniao", "segunda-reuniao", "comparador", "proposta", "diagnostico"];
  const PDF_NOMES = ["Relatório mensal ao cliente", "Revisão de carteira", "Primeira reunião", "Segunda reunião"];
  const permitePdf = (t) => PDF_OK.includes(Object.keys(T).find((k) => T[k] === t)) || PDF_NOMES.includes(t && t.nome);
  const perguntasDe = (t) => (t.perguntas ?? [RESULTADO]).filter((p) => !(p.id === "atuacao" && perfil?.atuacao) && (p.id !== "resultado" || permitePdf(t)));

  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const LETRAS = "ABCDEFGH";
  const estado = { tela: "inicio", area: null, tarefa: null, passo: 0, respostas: {}, campos: {} };
  let ultimaChaveTela = "";

  const GLIFOS = {
    orbita: (s) => { const a = -0.47 + s * 1.05, x = (96 + 62 * Math.cos(a)).toFixed(1), y = (84 + 62 * Math.sin(a)).toFixed(1);
      return `<svg viewBox="0 0 180 180" fill="none"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6DFB2" stop-opacity=".9"/><stop offset="1" stop-color="#E8C88E" stop-opacity=".05"/></linearGradient></defs>${[78, 62, 46, 30].map((r, i) => `<circle cx="96" cy="84" r="${r}" stroke="url(#g1)" stroke-width="1" stroke-dasharray="${(i + s) % 2 ? "2 6" : "none"}"/>`).join("")}<circle cx="${x}" cy="${y}" r="4" fill="#F6DFB2"/><circle cx="96" cy="84" r="2.5" fill="#F6DFB2"/></svg>`; },
    relevo: (s) => { const px = 100 + ((s * 29) % 50) - (s ? 25 : 0), k = 1 + (s % 3) * 0.15;
      return `<svg viewBox="0 0 180 180" fill="none"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F6DFB2" stop-opacity=".9"/><stop offset="1" stop-color="#E8C88E" stop-opacity=".05"/></linearGradient></defs>${Array.from({ length: 9 }, (_, i) => { const y = 40 + i * 13; return `<path d="M10 ${y} C 50 ${y - 4}, ${px - 30} ${y - (26 + i) * k}, ${px} ${y - (30 + i * 1.5) * k} S 150 ${y - 6}, 175 ${y - 2}" stroke="url(#g2)" stroke-width="1" opacity="${1 - i * 0.09}"/>`; }).join("")}</svg>`; },
    quadros: (s) => `<svg viewBox="0 0 180 180" fill="none">${[0, 1, 2].map((i) => `<rect x="${40 + i * 14}" y="${28 + i * 14}" width="86" height="106" rx="14" fill="rgba(246,223,178,${0.015 + i * 0.02})" stroke="rgba(246,223,178,${0.22 + i * 0.28})" stroke-width="1" transform="rotate(${-10 + i * 7 + s * 6} 100 90)"/>`).join("")}<circle cx="134" cy="60" r="3.5" fill="#F6DFB2"/></svg>`,
  };

  function porta(cls, html, aoClicar) {
    const p = el("button", cls, html);
    p.onpointermove = (e) => { const r = p.getBoundingClientRect(); p.style.setProperty("--mx", `${e.clientX - r.left}px`); p.style.setProperty("--my", `${e.clientY - r.top}px`); };

  }

  function voltarTela() {
    if (estado.tela === "lista") ir(estado.pasta ? "lista" : "inicio", estado.pasta ? { pasta: null } : {});
    else if (estado.tela === "guia") voltarPasso();
    else if (estado.tela === "fim") perguntasDe(T[estado.tarefa]).length ? ir("guia", { passo: perguntasDe(T[estado.tarefa]).length - 1 }) : ir("lista");
    else if (estado.tela === "acompanhar") ir("lista");
  }

  function trilho() {
    $("#voltar").hidden = estado.tela === "inicio";
    const nav = $("#trilho"); nav.replaceChildren();
    const add = (texto, acao) => { if (nav.childElementCount) nav.append(el("span", "", "/")); const b = el("button", "", esc(texto)); if (acao) b.onclick = acao; else b.style.color = "var(--ink)"; nav.append(b); };
    if (estado.tela === "inicio") return;
    const area = AREAS.find((a) => a.id === estado.area);
    add("Início", () => ir("inicio"));
    const gp = AREAS.flatMap((x) => x.grupos).find((g) => g.pasta && (estado.tela === "lista" ? g.nome === estado.pasta : g.tarefas.includes(estado.tarefa)));
    add(area.nome, estado.tela === "lista" && !gp ? null : () => ir("lista", { pasta: null }));
    if (gp) add(gp.nome, estado.tela === "lista" ? null : () => ir("lista", { pasta: gp.nome }));
    if (estado.tarefa) add(T[estado.tarefa]?.nome || estado.historico?.nome || "Do histórico", null);
  }

  function ir(tela, extra = {}) {
    if (tela === "guia") { const tid = extra.tarefa || estado.tarefa; if (tid && T[tid] && perguntasDe(T[tid]).length === 0) tela = "fim"; }
    if (tela === "lista" && !("pasta" in extra)) { const gp = AREAS.flatMap((x) => x.grupos).find((g) => g.pasta && g.tarefas.includes(estado.tarefa)); extra = { ...extra, pasta: gp ? gp.nome : null }; }
    Object.assign(estado, { tela }, extra);
    if (tela === "inicio") Object.assign(estado, { area: null, tarefa: null, pasta: null });
    if (tela === "lista") Object.assign(estado, { tarefa: null });

  function render() {

    tela.append(v);
    const chaveTela = `${estado.tela}|${estado.tarefa}|${estado.passo}`;
    if (chaveTela !== ultimaChaveTela) { tela.scrollTop = 0; ultimaChaveTela = chaveTela; }
  }

  function faixaCaptaMais() {

  function cartaoPerfil() {

  function telaInicio(v) {
    const h = new Date().getHours();
    const primeiro = (perfil?.nome || "").trim().split(/\s+/)[0];
    v.append(el("div", "ola", (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + (primeiro ? `, ${esc(primeiro)}.` : ".")));

    else if (perfil?.historico?.length) {

      v.append(dica);

    const portas = el("div", "portas");

      portas.append(porta("porta", `${GLIFOS[a.glifo](0)}<div class="n">0${i + 1} · ${n} tarefas</div><h3>${esc(a.nome)}</h3><p>${esc(a.desc)}</p><div class="ir"><b></b>Entrar</div>`,

  function telaLista(v) {
    const a = AREAS.find((x) => x.id === estado.area);
    const pastaAtual = a.grupos.find((g) => g.pasta && g.nome === estado.pasta);
    const itens = pastaAtual ? pastaAtual.tarefas.map((id) => ({ id, grupo: pastaAtual.nome })) : a.grupos.flatMap((g) => g.pasta ? [{ pasta: g }] : g.tarefas.map((id) => ({ id, grupo: g.nome })));
    const n = itens.length, cols = n <= 3 ? n : n === 4 ? 2 : n <= 6 ? 3 : 4;

        () => ir("guia", { tarefa: id, passo: 0, respostas: {}, campos: {} }));
      if (t.custom) {

  function telaGuia(v) {

    const restaurar = el("button", "mini", "Restaurar texto original");

    if (conectado) {

        } catch { st.className = "estado erro"; st.textContent = "Não consegui salvar o modelo agora."; }

      apagar.onclick = async () => {
        try {

  };
  const promptAtual = (t, ps) => {
    const base = montarPedido(t, ps);
    if (promptEdit.base !== base) { const m = perfil?.modelos?.[estado.tarefa]; promptEdit = { base, texto: m ? aplicarModelo(m, base) : base, modelo: !!m, editado: false }; }
    return promptEdit;
  };
  const registrar = (evento, extra = {}) => { if (conectado) app.callServerTool({ name: "mesa_registrar", arguments: { evento, ...extra } }).catch(() => {}); };

  async function copiarTexto(texto, campo) {
    try { await navigator.clipboard.writeText(texto); return true; } catch {}
    try {
      const ta = campo ?? Object.assign(document.createElement("textarea"), { value: texto });
      if (!campo) { ta.style.cssText = "position:fixed;opacity:0;left:-9999px"; document.body.append(ta); }
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      if (!campo) ta.remove();
      return ok;
    } catch { return false; }
  }
  async function botaoCopiar(btn, texto, campo, evento) {
    const rotulo = btn.textContent, ok = await copiarTexto(texto, campo);
    btn.textContent = ok ? "Copiado ✓" : "Selecione e copie (Ctrl+C)";
    if (!ok && campo) { campo.focus(); campo.select(); }
    if (ok && campo) { campo.setSelectionRange(campo.value.length, campo.value.length); campo.blur(); }
    if (ok && evento) registrar(evento);
    setTimeout(() => { btn.textContent = rotulo; }, 2200);
  }

  // A caixa de continuar a conversa envia até LIMITE_CAIXA caracteres. Acima disso não corta: avisa e não envia.
  const LIMITE_CAIXA = 4000;
  async function enviarMensagem(texto, st) {
    texto = texto.trim(); if (!texto) return false;
    if (texto.length > LIMITE_CAIXA) { st.className = "estado erro"; st.textContent = `A mensagem tem ${milhar(texto.length)} caracteres e a caixa envia até ${milhar(LIMITE_CAIXA)}. Encurte ou mande em duas partes.`; return false; }
    if (!conectado) { st.className = "estado erro"; st.textContent = "O painel não se conectou ao Claude. Peça a Mesa de novo numa conversa nova."; return false; }
    try {
      const r = await app.sendMessage({ role: "user", content: [{ type: "text", text: texto }] });
      if (r?.isError) { st.className = "estado erro"; st.textContent = "Não foi aceito. Tente de novo."; return false; }
      conversa = [...conversa, texto].slice(-6); rascunhoChat = "";
      registrar("conversa_continuada");
      return true;
    } catch (e) { st.className = "estado erro"; st.textContent = "Não consegui enviar: " + (e?.message ?? e); return false; }
  }

  async function baixarEntrega(st) {
    st.className = "estado"; st.textContent = "Preparando o arquivo…";
    try {
      const r = (await app.callServerTool({ name: "mesa_baixar", arguments: {} }))?.structuredContent;
      if (!r?.ok) { st.className = "estado erro"; st.textContent = "Não consegui ler o arquivo. Peça no chat para salvá-lo na pasta Documentos e gerar de novo."; return; }
      if (!app.getHostCapabilities()?.downloadFile) { st.className = "estado erro"; st.textContent = "Este Claude não baixa por aqui. Peça no chat o local do arquivo."; return; }
      const x = await app.downloadFile({ contents: [{ type: "resource", resource: { uri: `file:///${r.nome}`, mimeType: r.tipo, blob: r.blob } }] });
      if (x?.isError) { st.className = "estado erro"; st.textContent = "Download cancelado."; return; }
      st.className = "estado ok"; st.textContent = "Baixado ✓";
    } catch (e) { st.className = "estado erro"; st.textContent = "Não consegui baixar: " + (e?.message ?? e); }
  }

  let app = null, conectado = false, enviando = false;
  async function enviarPedido(t, ps) {
    if (enviando) return;
    const st = $(".estado"); const inteiro = (promptAtual(t, ps).texto || "").trim(); const texto = inteiro.slice(0, CORTE_PEDIDO);
    if (!texto) { st.className = "estado erro"; st.textContent = "O pedido está vazio."; return; }
    if (inteiro.length > CORTE_PEDIDO && corteAvisado !== inteiro) { corteAvisado = inteiro; st.className = "estado erro"; st.textContent = avisoDeCorte(inteiro.length) + " Para enviar assim mesmo, cortado, clique de novo."; return; }
    if (typeof window.__mesaStatus === "function" && window.__mesaStatus().estado === "pensando") { st.className = "estado erro"; st.textContent = "O Claude ainda está trabalhando no pedido anterior. Espere terminar ou clique em parar na caixa de baixo."; return; }
    if (!conectado) {
      if (window.parent !== window) { st.className = "estado erro"; st.textContent = "O painel não se conectou ao Claude. Peça a Mesa de novo numa conversa nova."; return; }
      console.log(texto); acompanhar(); return;
    }
    enviando = true; st.className = "estado"; st.textContent = "Enviando…";
    try {
      app.callServerTool({ name: "mesa_registrar", arguments: (tarefasUsuario.some((x) => x.id === t.id) ? { evento: "tarefa_enviada", tarefa: "Tarefa própria", area: AREAS.find((x) => x.id === estado.area)?.nome, respostas: [] } : { evento: "tarefa_enviada", tarefa: t.nome, area: AREAS.find((x) => x.id === estado.area)?.nome, respostas: ps.flatMap((p) => estado.respostas[p.id] ?? []).slice(0, 8) }) }).catch(() => {});
      await app.callServerTool({ name: "mesa_andamento", arguments: { agora: "" } }).catch(() => {});
      await app.updateModelContext({ content: [{ type: "text", text: instrucao(t) }] }).catch(() => {});
      const r = await app.sendMessage({ role: "user", content: [{ type: "text", text: texto }] });
      if (r?.isError) { st.className = "estado erro"; st.textContent = "Não foi aceito. Tente de novo."; return; }
      if (app.getHostContext()?.displayMode !== "fullscreen" && app.getHostContext()?.availableDisplayModes?.includes("fullscreen")) {
        await app.requestDisplayMode({ mode: "fullscreen" }).catch(() => {}); aplicarHost();
      }
      acompanhar();
    } catch (e) { st.className = "estado erro"; st.textContent = "Não consegui enviar: " + (e?.message ?? e); }
    finally { enviando = false; }
  }

  function aplicarHost() {
    const ctx = app?.getHostContext(); if (!ctx) return;

  async function entrarNoNavegador() {
    const m = painelConta('<div style="color:var(--mute)">…</div>');
    let r; try { r = (await app.callServerTool({ name: "mesa_conectar", arguments: { acao: "iniciar" } }))?.structuredContent; } catch { r = null; }
    if (!r || r.status !== "aguardando") { m.innerHTML = `<div>${esc(r?.mensagem ?? "Não foi possível conectar agora.")}</div>`; m.append(botaoGrande("Tentar de novo", entrarNoNavegador)); return; }
    m.style.padding = "20px"; m.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px"><img src="${LOGO_CAPTAMAIS}" alt="" width="52" height="52" style="display:block;border-radius:13px;box-shadow:0 8px 22px -8px rgba(255,140,40,.55)" onerror="this.style.display='none'"><div style="font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--gold2)">CaptaMais</div></div>`;
    const estadoLinha = el("div", "dica"); estadoLinha.style.cssText = "visibility:visible;display:none;text-align:center;margin-top:14px"; estadoLinha.id = "loginEstado";
    const abrir = async (url) => { estadoLinha.textContent = (await abrirLink(url)) ? "Aguardando… No CaptaMais, entre se pedir e clique em Conectar no aviso «Conectar a Mesa do Assessor» (role a página até ele, se precisar). Esta janela conecta sozinha em seguida." : url; estadoLinha.style.display = "block"; };
    const bLogin = botaoGrande("Login", () => abrir(r.conta)); bLogin.style.marginTop = "0";
    const cod = el("div", "dica"); cod.style.cssText = "visibility:visible;text-align:center;margin:0 0 14px";
    cod.innerHTML = 'Código deste pedido: <b style="color:var(--ink);letter-spacing:.08em">' + esc(r.codigo || "") + '</b><br>Confira se é o mesmo no site antes de conectar.';
    m.append(cod, bLogin);
    const bNova = botaoGrande("Nova conta", () => abrir(r.cadastro || r.conta)); bNova.style.marginTop = "12px";
    m.append(bNova, estadoLinha);
    clearInterval(loginVigia);
    loginVigia = setInterval(async () => {
      let v; try { v = (await app.callServerTool({ name: "mesa_conectar", arguments: { acao: "verificar" } }))?.structuredContent; } catch { return; }
      if (v?.status === "conectado") { fecharLogin(); await recarregarConta(); }
      else if (v?.status === "vencido" || v?.status === "nenhum") {
        clearInterval(loginVigia); loginVigia = null;
        const aberto = document.getElementById("modalConta"); if (!aberto) return;
        aberto.innerHTML = '<div style="color:var(--mute)">Pedido vencido.</div>'; aberto.append(botaoGrande("Tentar de novo", entrarNoNavegador));
      }
    }, 3000);

  function abrirEntrar() {

    const estiloCampo = "width:100%;padding:11px 13px;margin-top:10px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:15px";
    const mail = el("input"); mail.type = "email"; mail.name = "email"; mail.autocomplete = "username"; mail.placeholder = "Seu e-mail do CaptaMais"; mail.style.cssText = estiloCampo; mail.setAttribute("aria-label", "E-mail");
    const senha = el("input"); senha.type = "password"; senha.name = "senha"; senha.autocomplete = "current-password"; senha.placeholder = "Sua senha"; senha.style.cssText = estiloCampo; senha.setAttribute("aria-label", "Senha");
    const msg = el("div"); msg.setAttribute("role", "alert"); msg.style.cssText = "min-height:20px;margin-top:10px;font-size:13px;line-height:1.4;color:#ff9d7a";

    const outro = el("button", "fantasma", "Entrar com o Google ou criar conta"); outro.type = "button"; outro.style.cssText = "margin-top:10px;width:100%;justify-content:center;text-align:center";
    const fechar = () => fundo.remove();

    const nota = el("p", "dica", "A senha vai direto para o CaptaMais e a Mesa não guarda."); nota.style.cssText = "visibility:visible;text-align:center;margin:12px 0 0;font-size:12px";

      ocupado = true; enviar.disabled = true; msg.style.color = "var(--mute)"; msg.textContent = "Entrando…";
      let r; try { r = await app.entrarComSenha(mail.value.trim(), senha.value); } catch { r = { status: "erro", mensagem: "Não consegui falar com o CaptaMais agora. Tente de novo." }; }

    cx.innerHTML = `<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px"><img src="${LOGO_CAPTAMAIS}" alt="" width="46" height="46" style="border-radius:12px;display:block"><div><h2 id="avisoDadosTitulo" style="font-size:20px;line-height:1.2;margin:0">${expirou ? "Reconectar com dados financeiros" : "Conectar com dados financeiros"}</h2>`
      + `<p style="color:var(--mute);margin:4px 0 0;font-size:15px">Conta gratuita no CaptaMais.</p></div></div>`;
    const lembrar = async () => { if (!caixa.checked) return; if (perfil) perfil.avisoDados = "nunca"; try { await app.callServerTool({ name: "mesa_perfil", arguments: { salvar: { avisoDados: "nunca" } } }); } catch {   } };
    const fechar = () => { fundo.remove(); };
    const sim = botaoGrande("Conectar", async () => { await lembrar(); fechar(); entrarComCaptaMais(); }); sim.style.marginTop = "20px";
    const agora = el("button", "fantasma", "Agora não"); agora.style.cssText = "margin-top:10px;width:100%;justify-content:center;text-align:center"; agora.onclick = async () => { await lembrar(); fechar(); };
    const rotulo = el("label"); rotulo.style.cssText = "display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--mute);font-size:14px;cursor:pointer";
    const caixa = el("input"); caixa.type = "checkbox"; caixa.style.cssText = "width:18px;height:18px;accent-color:#E8C88E;cursor:pointer;margin:0";
    rotulo.append(caixa, document.createTextNode("Não perguntar de novo"));
    cx.append(sim, agora, rotulo); fundo.append(cx);
    fundo.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); fechar(); } });
    document.body.append(fundo); sim.focus();
  }

  async function conectar() {
    if (window.parent === window) return;
    try {
      const m = globalThis.ExtApps;
      if (!m?.App) throw new Error("SDK do painel ausente");
      app = new m.App({ name: "Mesa", version: "1.0.0" }, { availableDisplayModes: ["inline", "fullscreen"] });
      app.ontoolinput = ({ arguments: args }) => { if (args?.area && AREAS.some((a) => a.id === args.area)) ir("lista", { area: args.area }); };
      app.ontoolresult = () => {};
      app.onhostcontextchanged = aplicarHost;
      await app.connect();
      conectado = true; aplicarHost(); atualizarConta();
      app.callServerTool({ name: "mesa_perfil", arguments: {} }).then((r) => {
        perfil = r?.structuredContent?.perfil ?? null;
        captamais = r?.structuredContent?.captamais ?? null;
        carregarTarefasUsuario(perfil?.tarefas);
        carregarAjustes(perfil?.ajustes);
        if (estado.tela === "inicio" && perfil?.rascunho) restaurarRascunho(true);
        atualizarConta();
        if (estado.tela === "inicio") render();
        avisoDados();
        app.callServerTool({ name: "mesa_registrar", arguments: { evento: "painel_aberto" } }).catch(() => {});
      }).catch(() => {});
    } catch { app = null; conectado = false; }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("modalConta")) { document.getElementById("modalConta").remove(); return; }
    if (e.target?.matches?.("textarea, input")) { if (e.key === "Escape") e.target.blur(); return; }
    if (estado.tela !== "guia") { if (e.key === "Escape") voltarTela(); return; }
    const p = perguntasDe(T[estado.tarefa])[estado.passo];
    const i = LETRAS.indexOf(e.key.toUpperCase());
    if (i >= 0 && i < p.opcoes.length) { escolher(p, p.opcoes[i].t); e.preventDefault(); }
    else if (e.key === "Enter") { avancar(); e.preventDefault(); }
    else if (e.key === "Escape" || e.key === "Backspace") { voltarPasso(); e.preventDefault(); }
  });

  const cv = $("#relevo"), cx = cv.getContext("2d");
  const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function dimensionar() { const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); }
  const onda = (x, i, t) => Math.sin(x * 0.011 + i * 0.55 + t * 0.22) * 0.55 + Math.sin(x * 0.027 - i * 0.33 + t * 0.15) * 0.3 + Math.sin(x * 0.0042 + i * 0.12 - t * 0.08) * 0.65;
  function relevo(ms) {
    const t = ms / 1000, W = innerWidth, H = innerHeight, N = 30;
    cx.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const p = i / (N - 1), y0 = H * 0.30 + Math.pow(p, 1.7) * H * 0.78, amp = 8 + p * 74;
      cx.beginPath();
      for (let x = -20; x <= W + 20; x += 7) {
        const pico = 0.22 + 1.35 * Math.exp(-Math.pow((x - W * 0.66) / (W * 0.2), 2));
        const y = y0 - Math.max(0, onda(x * (0.85 + p * 0.3), i, t)) * amp * pico - onda(x, i * 1.6, t) * amp * 0.12;
        x === -20 ? cx.moveTo(x, y) : cx.lineTo(x, y);
      }
      cx.lineTo(W + 20, H + 40); cx.lineTo(-20, H + 40); cx.closePath();
      cx.fillStyle = "#101113"; cx.fill();
      const a = 0.035 + p * 0.17, brilho = cx.createLinearGradient(0, 0, W, 0);
      brilho.addColorStop(0, `rgba(236, 216, 178, ${a * 0.45})`);
      brilho.addColorStop(0.66, `rgba(246, 223, 178, ${Math.min(0.55, a * 2.3)})`);
      brilho.addColorStop(1, `rgba(236, 216, 178, ${a * 0.6})`);
      cx.strokeStyle = brilho; cx.lineWidth = 1; cx.stroke();
    }
    if (!parado) requestAnimationFrame(relevo);
  }
  addEventListener("resize", dimensionar); dimensionar(); requestAnimationFrame(relevo);

  render();
  conectar();
</script>
</body>
</html>
